[versions]
# Kotlin and related
kotlin = "2.3.10"
kotlin-coroutines = "1.10.2"
kotlin-serialization = "1.10.0"
kotlin-symbol-processing = "2.3.6"
kotlin-immutable-collections = "0.4.0"
kotlinpoet = "2.2.0"
dokka = "2.1.0"

# AndroidX Core and UI
androidx-core = "1.18.0"
androidx-appcompat = "1.7.1"
androidx-activity = "1.13.0"
androidx-fragment = "1.8.9"
androidx-lifecycle = "2.10.0"
androidx-constraintlayout = "2.2.1"
androidx-recyclerview = "1.4.0"
androidx-recyclerview-selection = "1.2.0"
androidx-palette = "1.0.0"
androidx-splashscreen = "1.2.0"

# Jetpack Compose
compose-bill-of-materials = "2026.03.00"
compose-navigation = "2.9.7"
compose-constraintlayout = "1.1.1"
compose-theme-adapter = "1.1.1"

# Hilt Dependency Injection
hilt = "2.59.2"
hilt-navigation-compose = "1.3.0"
hilt-lifecycle-viewmodel = "1.3.0"
javax-inject = "1"

# Local Data Storage (Room)
androidx-room = "2.8.4"

# Network and Serialization
retrofit-converter-gson = "3.0.0"

# Firebase
firebase-bill-of-materials = "34.10.0"
google-services-plugin = "4.4.4"
firebase-crashlytics-plugin = "3.0.6"
firebase-app-distribution-plugin = "5.2.1"

# Google Maps and Location
google-maps-utils = "4.1.0"
google-maps-kotlin-extensions = "6.0.0"
google-places = "5.1.1"
google-play-services-location = "21.3.0"
google-play-services-places = "17.1.0"

# Utilities
timber = "5.0.1"
coil = "2.7.0"
zxing = "3.5.4"
material = "1.13.0"
viewbinding-delegate = "1.5.9"

# Testing
junit = "4.13.2"
androidx-test-junit = "1.3.0"
espresso = "3.7.0"
mockk = "1.14.9"
guava-testlib = "33.5.0-android"
navigation-testing = "2.9.7"

# Build Plugins
android-gradle-plugin = "9.1.0"

[libraries]
# --- Kotlin ---
# Kotlin standard libraries, coroutines and language features
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlin-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlin-serialization" }
kotlin-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlin-coroutines" }
kotlin-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlin-coroutines" }
kotlin-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "kotlin-immutable-collections" }
kotlinpoet = { module = "com.squareup:kotlinpoet", version.ref = "kotlinpoet" }
kotlinpoet-kotlin-symbol-processing = { module = "com.squareup:kotlinpoet-ksp", version.ref = "kotlinpoet" }
kotlin-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "kotlin-symbol-processing" }

# --- Android Core ---
# Core AndroidX libraries for basic app functionality and backward compatibility
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-appcompat-resources = { group = "androidx.appcompat", name = "appcompat-resources", version.ref = "androidx-appcompat" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidx-activity" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "androidx-fragment" }
androidx-lifecycle-viewmodel-kotlin-extensions = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-kotlin-extensions = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-android = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-android", version.ref = "androidx-lifecycle" }

# --- Jetpack Compose ---
# Modern toolkit for building native UI with Compose
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bill-of-materials" }
androidx-compose-animation-graphics = { group = "androidx.compose.animation", name = "animation-graphics" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
androidx-compose-activity = { group = "androidx.activity", name = "activity-compose" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "compose-navigation" }
androidx-compose-constraintlayout = { module = "androidx.constraintlayout:constraintlayout-compose", version.ref = "compose-constraintlayout" }
google-compose-theme-adapter = { group = "com.google.android.material", name = "compose-theme-adapter-3", version.ref = "compose-theme-adapter" }

# --- Hilt Dependency Injection ---
# Dependency injection for Android with Hilt and Dagger framework
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
androidx-hilt-lifecycle-viewmodel = { module = "androidx.hilt:hilt-lifecycle-viewmodel", version.ref = "hilt-lifecycle-viewmodel" }
javax-inject = { module = "javax.inject:javax.inject", version.ref = "javax-inject" }

# --- Local Data Storage ---
# Room persistence library for local database management and SQLite abstraction
androidx-room-common = { group = "androidx.room", name = "room-common", version.ref = "androidx-room" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "androidx-room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "androidx-room" }
androidx-room-migrations = { group = "androidx.room", name = "room-migration", version.ref = "androidx-room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "androidx-room" }

# --- Network & Serialization ---
# Libraries for network communication, API requests and data parsing
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit-converter-gson" }

# --- Firebase ---
# Firebase platform services for analytics, crash reporting and cloud database
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bill-of-materials" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-database = { module = "com.google.firebase:firebase-database" }

# --- UI & Themes ---
# Material Design components, themes and UI-related layout utilities
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-palette-kotlin-extensions = { group = "androidx.palette", name = "palette-ktx", version.ref = "androidx-palette" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "androidx-constraintlayout" }
androidx-databinding-runtime = { module = "androidx.databinding:databinding-runtime", version.ref = "android-gradle-plugin" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-recyclerview-selection = { module = "androidx.recyclerview:recyclerview-selection", version.ref = "androidx-recyclerview-selection" }

# --- Maps & Location ---
# Google Maps SDK, Places API and Location services integration
google-maps-utils = { module = "com.google.maps.android:android-maps-utils", version.ref = "google-maps-utils" }
google-maps-ktx = { module = "com.google.maps.android:maps-ktx", version.ref = "google-maps-kotlin-extensions" }
google-maps-utils-ktx = { module = "com.google.maps.android:maps-utils-ktx", version.ref = "google-maps-kotlin-extensions" }
google-places = { module = "com.google.android.libraries.places:places", version.ref = "google-places" }
google-play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "google-play-services-location" }
google-play-services-places = { module = "com.google.android.gms:play-services-places", version.ref = "google-play-services-places" }

# --- Utilities ---
# General-purpose utility libraries for logging, image loading and more
timber = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
coil-compose = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-svg = { module = "io.coil-kt:coil-svg", version.ref = "coil" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
viewbinding-delegate-no-reflection = { module = "com.github.kirich1409:viewbindingpropertydelegate-noreflection", version.ref = "viewbinding-delegate" }

# --- Testing ---
# Libraries for unit testing, UI testing and mocking
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-navigation-testing = { group = "androidx.navigation", name = "navigation-testing", version.ref = "navigation-testing" }
google-guava-testlib = { module = "com.google.guava:guava-testlib", version.ref = "guava-testlib" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
# Android Build Plugins
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
android-library = { id = "com.android.library", version.ref = "android-gradle-plugin" }
android-lint = { id = "com.android.lint", version.ref = "android-gradle-plugin" }

# Kotlin Build Plugins
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kotlin-symbol-processing = { id = "com.google.devtools.ksp", version.ref = "kotlin-symbol-processing" }
kotlin-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Google & Firebase Build Plugins
google-services = { id = "com.google.gms.google-services", version.ref = "google-services-plugin" }
google-firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
google-firebase-app-distribution = { id = "com.google.firebase.appdistribution", version.ref = "firebase-app-distribution-plugin" }

# Hilt Dependency Injection Plugin
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
