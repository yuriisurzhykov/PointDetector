# git-cliff configuration: https://git-cliff.org/docs/configuration
# The changelog is generated from Conventional Commits (https://www.conventionalcommits.org).

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
It is generated by [git-cliff](https://git-cliff.org) from Conventional Commits.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}\
{% if commit.breaking %} **[BREAKING]**{% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = false

[git]
conventional_commits = true
# Commits that are not valid Conventional Commits (e.g. old history) are left out.
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v?[0-9]+\\.[0-9]+.*"
topo_order = false
sort_commits = "oldest"

# The <!-- N --> prefix only fixes the group order; it is stripped in the template.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 3 -->♻️ Refactoring" },
  { message = "^revert", group = "<!-- 4 -->⏪ Reverts" },
  { message = "^docs", group = "<!-- 5 -->📚 Documentation" },
  { message = "^test", group = "<!-- 6 -->🧪 Tests" },
  { message = "^build", group = "<!-- 7 -->📦 Build" },
  { message = "^ci", group = "<!-- 8 -->🤖 CI" },
  { message = "^style", skip = true },
  { message = "^chore", skip = true },
]
